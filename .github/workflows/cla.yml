# CLA gate — blocks merging a pull request until its authors have agreed to CLA.md.
#
# How it works: on a new PR (or a new comment), the action checks whether each commit
# author has signed. If not, it comments asking them to paste the sign phrase below;
# once they do, it records their signature in the signatures JSON (committed by the bot)
# and turns the PR's CLA status check green. Returning contributors sign only once.
#
# Setup: no secrets needed — the built-in GITHUB_TOKEN is enough because signatures are
# stored in this same repo. Just enable Actions, and (recommended) make the "CLA
# Assistant" status check a required check on the protected branch so it actually gates
# merge. See CONTRIBUTING.md for the contributor-facing flow.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write       # to commit the signatures file
  pull-requests: write  # to comment on the PR
  statuses: write       # to set the CLA status check

jobs:
  cla:
    runs-on: ubuntu-latest
    # Only react to the sign phrase or to PR events — ignore unrelated comments.
    if: >
      (github.event_name == 'issue_comment' &&
        (contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA') ||
         contains(github.event.comment.body, 'recheck'))) ||
      github.event_name == 'pull_request_target'
    steps:
      - name: CLA check
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The agreement contributors are signing.
          path-to-document: 'https://github.com/ssethia2/aria/blob/main/CLA.md'
          # Bot-managed ledger of who has signed (do not hand-edit). Stored on the
          # 'cla-signatures' branch to keep main's history clean; the action creates it.
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'cla-signatures'
          # The exact phrase a contributor comments to sign.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: >
            Thanks for the pull request! Before it can be merged, please read our
            [Contributor License Agreement](https://github.com/ssethia2/aria/blob/main/CLA.md)
            and sign it by posting the following as a comment on this PR:
          custom-allsigned-prcomment: '✅ All contributors have signed the CLA.'
          # People/bots that never need to sign (maintainer + common automation bots).
          allowlist: 'ssethia2,dependabot[bot],github-actions[bot]'
