# Grounding & routing — facts about your life come from tools this turn, never from stale
# chat; and the cheap fast path answers only what it safely can.

- id: due-date-from-the-store
  why: "She once answered due dates from stale chat and mixed up the days. 'When is X due?' must be read from list_commitments this turn."
  setup:
    commitments:
      - {description: "Pay rent", kind: deadline, due_date: "{{today+2}}"}
  turns:
    - user: "When's rent due again?"
      expect:
        path: agent
        called: [list_commitments]
        mentions_date: "{{today+2}}"

- id: reminder-time-followup
  why: "Referential follow-ups ('what time was that?') must escalate past the fast path and be answered from the store — the fast path once guessed times from a partial snippet."
  turns:
    - user: "Remind me to call the bank tomorrow at 5pm."
      expect:
        called: [add_commitment]
        called_with:
          add_commitment: {due_date_iso: "{{today+1}}", due_time: {time: "17:00"}}
    - user: "Wait, what time did I say?"
      expect:
        path: agent
        reply_matches: ['\b(5(:00)?\s*(pm|p\.m\.)|17:00)']

- id: fast-path-general-knowledge
  why: "Pure general-knowledge questions should be answered by the cheap fast path, not the full agent (cost). Fails by design under --no-quick."
  turns:
    - user: "What's 15% of 84?"
      expect:
        path: quick
        reply_matches: ['12\.6']

- id: relative-deadline-no-date-question
  why: "Live bug: after one date slip she blamed her clock and kept asking the user for today's date. Every message carries its timestamp — work it out, never ask."
  turns:
    - user: "I need to do the coding assessment within the next 10 days."
      expect:
        called_with:
          add_commitment: {due_date_iso: {one_of: ["{{today+10}}", "{{today+9}}"]}}
        reply_not_matches: ["what('s| is) today", "today's date", "what (date|day) is it", "clock"]

- id: two-trips-right-airline
  why: "Live bug: he asked to call an airline about one leg of a trip; she'd forgotten the itinerary they built two days earlier, guessed that airline's booking, then said an unreadable email 'confirmed' it. The leg he meant belongs to the other booking; say so from memory, never invent a match."
  tools:
    search_memory: |
      Semantic Memory (Past):
      - Flight from Porto to Lisbon on November 27 2026: TravelCo booking, TAP TP 202 Porto 7:30am to Lisbon 8:35am. (noted 2026-11-03)
      - Northwind Air booking QX12AB: Lisbon departing December 17 2026 at 00:30, Paris 05:05, then Boston. (noted 2026-11-03)
    read_email_thread: |
      Matching threads, newest first:
      1. Flying Club <crm@service.example.com> — Your booking confirmation QX12AB (1 message)
      Thread 1 in full: Flying Club &zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;
  turns:
    - user: "I need to call Northwind and change my flight from Porto to Lisbon"
      expect:
        reply_matches: ['TP ?202|TravelCo|TAP']
        judge: >
          Says the Porto→Lisbon flight is the TAP TP 202 on the TravelCo booking, not Northwind's
          QX12AB (Northwind is the December return), so Northwind isn't who changes it. Does NOT claim QX12AB
          covers Porto→Lisbon or that any email confirmed it. Asks at most one question.
